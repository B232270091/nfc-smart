name: Verify NFC Smart
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  local-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- tests/e2e/public-smoke.spec.ts
